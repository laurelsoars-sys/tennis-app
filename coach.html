<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="padding:20px">
  <div class="page-header">
    <div class="logo">
      <div class="logo-icon">🎾</div>
      <div>
        <div class="logo-text">Coach dashboard</div>
        <div class="logo-sub" id="welcome"></div>
      </div>
    </div>
    <div class="header-buttons">
      <button class="btn btn-secondary btn-sm" onclick="window.location.href='sessions.html'">Helper view</button>
      <button class="btn btn-secondary btn-sm" onclick="window.location.href='fairness.html'">Fairness</button>
      <button class="btn btn-primary btn-sm" onclick="window.location.href='create-session.html'">+ New session</button>
      <button class="btn btn-secondary btn-sm" onclick="logout()">Sign out</button>
    </div>
  </div>

  <div id="dashboard"></div>

  <div class="pagination">
    <button class="btn btn-secondary btn-sm" onclick="changePage(-1)" id="prev-btn" disabled>Previous</button>
    <span class="page-info" id="page-info">Page 1</span>
    <button class="btn btn-secondary btn-sm" onclick="changePage(1)" id="next-btn">Next</button>
  </div>

  <div class="court-lines"></div>

  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) window.location.href = 'index.html';
    document.getElementById('welcome').textContent = `Hi ${user.full_name}!`;

    const LIMIT = 5;
    let offset = 0;
    let page = 1;

    async function loadDashboard() {
      try {
        const sessionsRes = await fetch(`https://tennis-app-9esu.onrender.com/sessions?limit=${LIMIT}&offset=${offset}`);
        const sessions = await sessionsRes.json();
        const fairnessRes = await fetch('https://tennis-app-9esu.onrender.com/fairness');
        const fairness = await fairnessRes.json();
        const dashboard = document.getElementById('dashboard');

        const counts = {};
        fairness.forEach(h => counts[h.name] = h.rate);
        const values = Object.values(counts);
        const max = Math.max(...values, 1);
        const min = Math.min(...values, 0);
        const mid = (max + min) / 2;

        function getColor(name) {
          const rate = counts[name] ?? 0;
          if (rate <= min + (mid - min) / 2) return '#16a34a';
          if (rate <= mid) return '#ca8a04';
          return '#dc2626';
        }

        document.getElementById('prev-btn').disabled = offset === 0;
        document.getElementById('next-btn').disabled = sessions.length < LIMIT;
        document.getElementById('page-info').textContent = `Page ${page}`;

        if (sessions.length === 0) {
          dashboard.innerHTML = '<p class="empty">No sessions found.</p>';
          return;
        }

        let html = '';
        for (const session of sessions) {
          const availRes = await fetch(`https://tennis-app-9esu.onrender.com/availability/${session.id}`);
          const availability = await availRes.json();
          const assignRes = await fetch(`https://tennis-app-9esu.onrender.com/assignments/${session.id}`);
          const assignments = await assignRes.json();
          const assignedIds = assignments.filter(a => a.status === 'approved').map(a => a.helper_id);

          const helperRows = availability.length === 0
            ? '<p class="empty">No helpers available yet.</p>'
            : availability.map(a => {
                const assignment = assignments.find(x => x.helper_id === a.helper_id);
                const status = assignment ? assignment.status : null;

                let btns = '';
                if (status === 'approved') {
                  btns = `
                    <div class="action-btns">
                      <span class="tag tag-green">Approved</span>
                      <button class="btn btn-gray btn-sm" onclick="updateStatus('${session.id}', '${a.helper_id}', 'waitlist')">Undo</button>
                    </div>`;
                } else if (status === 'waitlist') {
                  btns = `
                    <div class="action-btns">
                      <span class="tag tag-yellow">Waitlisted</span>
                      <button class="btn btn-approved btn-sm" onclick="updateStatus('${session.id}', '${a.helper_id}', 'approved')">Approve</button>
                      <button class="btn btn-danger btn-sm" onclick="updateStatus('${session.id}', '${a.helper_id}', 'declined')">Decline</button>
                    </div>`;
                } else if (status === 'declined') {
                  btns = `
                    <div class="action-btns">
                      <span class="tag tag-red">Declined</span>
                      <button class="btn btn-gray btn-sm" onclick="updateStatus('${session.id}', '${a.helper_id}', 'waitlist')">Undo</button>
                    </div>`;
                } else {
                  btns = `
                    <div class="action-btns">
                      <button class="btn btn-approved btn-sm" onclick="updateStatus('${session.id}', '${a.helper_id}', 'approved')">Approve</button>
                      <button class="btn btn-warning btn-sm" onclick="updateStatus('${session.id}', '${a.helper_id}', 'waitlist')">Waitlist</button>
                      <button class="btn btn-danger btn-sm" onclick="updateStatus('${session.id}', '${a.helper_id}', 'declined')">Decline</button>
                    </div>`;
                }

                return `
                  <div class="helper-row">
                    <span class="helper-name">
                      <span class="dot" style="background:${getColor(a.helper_name)}"></span>
                      ${a.helper_name || a.helper_id}
                    </span>
                    ${btns}
                  </div>`;
              }).join('');

          html += `
            <div class="card-wide">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
                <div>
                  <h2>${session.date}</h2>
                  <p class="session-meta">${session.time} &middot; ${session.expected_kids} kids &middot; ${assignedIds.length} assigned</p>
                </div>
                <div class="action-btns">
                  <button class="btn btn-secondary btn-sm" onclick="window.location.href='edit-session.html?id=${session.id}&date=${session.date}&time=${encodeURIComponent(session.time)}&kids=${session.expected_kids}'">Edit</button>
                  <button class="btn btn-danger btn-sm" onclick="deleteSession('${session.id}')">Delete</button>
                </div>
              </div>
              ${helperRows}
            </div>`;
        }

        html += `
          <div class="card-wide" style="padding:12px 20px">
            <p style="font-size:12px;color:#999;margin-bottom:8px;font-weight:500">FAIRNESS KEY</p>
            <div style="display:flex;gap:16px;flex-wrap:wrap">
              <span style="font-size:13px;color:#444;display:flex;align-items:center;gap:6px"><span class="dot" style="background:#16a34a"></span>Fewest sessions</span>
              <span style="font-size:13px;color:#444;display:flex;align-items:center;gap:6px"><span class="dot" style="background:#ca8a04"></span>Average</span>
              <span style="font-size:13px;color:#444;display:flex;align-items:center;gap:6px"><span class="dot" style="background:#dc2626"></span>Most sessions</span>
            </div>
          </div>`;

        dashboard.innerHTML = html;
      } catch (err) {
        console.error('Dashboard error:', err);
        document.getElementById('dashboard').innerHTML = '<p class="empty">Error loading dashboard.</p>';
      }
    }

    function changePage(direction) {
      offset += direction * LIMIT;
      page += direction;
      loadDashboard();
      window.scrollTo(0, 0);
    }

    async function updateStatus(sessionId, helperId, status) {
      try {
        await fetch(`https://tennis-app-9esu.onrender.com/assignments/${sessionId}/${helperId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        loadDashboard();
      } catch (err) {
        console.error('Update error:', err);
      }
    }

    async function deleteSession(sessionId) {
      if (!confirm('Are you sure you want to delete this session?')) return;
      await fetch(`https://tennis-app-9esu.onrender.com/sessions/${sessionId}`, { method: 'DELETE' });
      loadDashboard();
    }

    function logout() {
      localStorage.removeItem('user');
      window.location.href = 'index.html';
    }

    loadDashboard();
  </script>
</body>
</html>
