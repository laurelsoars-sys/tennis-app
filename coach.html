<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { margin: 0; color: #1a1a1a; }
    h2 { color: #1a1a1a; margin: 0 0 4px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); margin-bottom: 16px; }
    .session-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .session-info p { margin: 0; color: #666; font-size: 14px; }
    .helper-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid #f0f0f0; }
    .helper-name { font-size: 15px; color: #1a1a1a; }
    button { padding: 8px 16px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .approved { background: #16a34a; }
    .approved:hover { background: #15803d; }
    .logout { background: none; color: #666; font-size: 14px; border: 1px solid #ddd; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    .logout:hover { background: #f0f4f8; }
    .empty { color: #666; font-size: 14px; }
    .pagination { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 16px; }
    .pagination button { width: auto; }
    .page-info { font-size: 14px; color: #666; }
    .header-buttons { display: flex; gap: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Coach dashboard</h1>
    <div class="header-buttons">
      <button onclick="window.location.href='fairness.html'">Fairness tracker</button>
      <button onclick="window.location.href='create-session.html'">Create session</button>
      <button class="logout" onclick="logout()">Sign out</button>
    </div>
  </div>
  <div id="dashboard"></div>
  <div class="pagination">
    <button onclick="changePage(-1)" id="prev-btn" disabled>Previous</button>
    <span class="page-info" id="page-info">Page 1</span>
    <button onclick="changePage(1)" id="next-btn">Next</button>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) window.location.href = 'index.html';

    const LIMIT = 5;
    let offset = 0;
    let page = 1;

    async function loadDashboard() {
      try {
        const sessionsRes = await fetch(`https://tennis-app-9esu.onrender.com/sessions?limit=${LIMIT}&offset=${offset}`);
        const sessions = await sessionsRes.json();
        const dashboard = document.getElementById('dashboard');

        document.getElementById('prev-btn').disabled = offset === 0;
        document.getElementById('next-btn').disabled = sessions.length < LIMIT;
        document.getElementById('page-info').textContent = `Page ${page}`;

        if (sessions.length === 0) {
          dashboard.innerHTML = '<p class="empty">No sessions found.</p>';
          return;
        }

        let html = '';
        for (const session of sessions) {
          const availRes = await fetch(`https://tennis-app-9esu.onrender.com/availability/${session.id}`);
          const availability = await availRes.json();

          const assignRes = await fetch(`https://tennis-app-9esu.onrender.com/assignments/${session.id}`);
          const assignments = await assignRes.json();
          const assignedIds = assignments.map(a => a.helper_id);

          const helperRows = availability.length === 0
            ? '<p class="empty">No helpers available yet.</p>'
            : availability.map(a => `
                <div class="helper-row">
                  <span class="helper-name">${a.helper_name || a.helper_id}</span>
                  <button
                    class="${assignedIds.includes(a.helper_id) ? 'approved' : ''}"
                    onclick="approve('${session.id}', '${a.helper_id}', this)">
                    ${assignedIds.includes(a.helper_id) ? 'Approved' : 'Approve'}
                  </button>
                </div>
              `).join('');

          html += `
            <div class="card">
              <div class="session-header">
                <div class="session-info">
                  <h2>${session.date}</h2>
                  <p>${session.time} · ${session.expected_kids} kids expected · ${assignedIds.length} helper${assignedIds.length !== 1 ? 's' : ''} assigned</p>
                </div>
                <button style="background:#dc2626" onclick="deleteSession('${session.id}')">Delete</button>
              </div>
              ${helperRows}
            </div>
          `;
        }
        dashboard.innerHTML = html;
      } catch (err) {
        console.error('Dashboard error:', err);
        document.getElementById('dashboard').innerHTML = '<p class="empty">Error loading dashboard.</p>';
      }
    }

    function changePage(direction) {
      offset += direction * LIMIT;
      page += direction;
      loadDashboard();
      window.scrollTo(0, 0);
    }
    async function deleteSession(sessionId) {
      if (!confirm('Are you sure you want to delete this session?')) return;
      await fetch(`https://tennis-app-9esu.onrender.com/sessions/${sessionId}`, {
        method: 'DELETE'
      });
      loadDashboard();
    }
    async function approve(sessionId, helperId, btn) {
      try {
        await fetch('https://tennis-app-9esu.onrender.com/assignments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: sessionId,
            helper_id: helperId,
            approved_by: user.id
          })
        });
        btn.textContent = 'Approved';
        btn.classList.add('approved');
      } catch (err) {
        console.error('Approve error:', err);
      }
    }

    function logout() {
      localStorage.removeItem('user');
      window.location.href = 'index.html';
    }
    
    loadDashboard();
  </script>
</body>
</html>
