<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: #f0f4f0; padding: 4px; border-radius: 12px; width: fit-content; }
    .tab { padding: 8px 20px; border-radius: 9px; border: none; font-size: 14px; font-weight: 500; cursor: pointer; background: none; color: #666; transition: all 0.15s; }
    .tab.active { background: white; color: #16a34a; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  </style>
</head>
<body style="padding:20px">
  <div class="page-header">
    <div class="logo">
      <div class="logo-icon">🎾</div>
      <div>
        <div class="logo-text">Coach dashboard</div>
        <div class="logo-sub" id="welcome"></div>
      </div>
    </div>
    <div class="header-buttons">
      <button class="btn btn-secondary btn-sm" onclick="window.location.href='profile.html'">Profile</button>
      <button class="btn btn-secondary btn-sm" onclick="window.location.href='fairness.html'">Fairness</button>
      <button class="btn btn-secondary btn-sm" onclick="window.location.href='calendar.html'">Calendar</button>
      <button class="btn btn-secondary btn-sm" onclick="window.location.href='helpers.html'">Helpers</button>
      <button class="btn btn-secondary btn-sm" onclick="window.location.href='broadcast.html'">Message helpers</button>
      <button class="btn btn-secondary btn-sm" onclick="window.location.href='sessions.html'">Helper view</button>
      <button class="btn btn-secondary btn-sm" onclick="logout()">Sign out</button>
      <button class="btn btn-secondary btn-sm" onclick="runArchive()">Auto archive</button>
      <a href="https://tennis-app-9esu.onrender.com/export/sessions" class="btn btn-secondary btn-sm" download>Export CSV</a>
      <button class="btn btn-primary btn-sm" onclick="window.location.href='create-session.html'">+ New session</button>
    </div>
  </div>

<div class="tabs">
  <button class="tab active" id="tab-upcoming" onclick="switchTab('upcoming')">Upcoming</button>
  <button class="tab" id="tab-past" onclick="switchTab('past')">Past sessions</button>
  <button class="tab" id="tab-archive" onclick="switchTab('archive')">Archive</button>
</div>

  <div id="dashboard"></div>

  <div class="pagination">
    <button class="btn btn-secondary btn-sm" onclick="changePage(-1)" id="prev-btn" disabled>Previous</button>
    <span class="page-info" id="page-info">Page 1</span>
    <button class="btn btn-secondary btn-sm" onclick="changePage(1)" id="next-btn">Next</button>
  </div>

  <div class="court-lines"></div>

  <script>
    function formatDate(dateStr) {
      const date = new Date(dateStr + 'T00:00:00');
      const today = new Date();
      const tomorrow = new Date();
      tomorrow.setDate(today.getDate() + 1);
      
      today.setHours(0,0,0,0);
      tomorrow.setHours(0,0,0,0);
      date.setHours(0,0,0,0);
      
      if (date.getTime() === today.getTime()) return 'Today';
      if (date.getTime() === tomorrow.getTime()) return 'Tomorrow';
      
      return date.toLocaleDateString('en-US', { 
        weekday: 'long', 
        month: 'long', 
        day: 'numeric' 
      });
    }
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) window.location.href = 'index.html';
    document.getElementById('welcome').textContent = `Hi ${user.full_name}!`;

    const LIMIT = 5;
    let offset = 0;
    let page = 1;
    let currentTab = 'upcoming';

    function switchTab(tab) {
      currentTab = tab;
      offset = 0;
      page = 1;
      document.getElementById('tab-upcoming').classList.toggle('active', tab === 'upcoming');
      document.getElementById('tab-past').classList.toggle('active', tab === 'past');
      document.getElementById('tab-archive').classList.toggle('active', tab === 'archive');
      loadDashboard();
    }

    async function loadDashboard() {
      document.getElementById('dashboard').innerHTML = '<div class="loading-state"><div class="spinner"></div><span>Loading dashboard...</span></div>';
      try {
        const sessionsRes = await fetch(`https://tennis-app-9esu.onrender.com/sessions?limit=${LIMIT}&offset=${offset}&filter=${currentTab === 'archive' ? 'past&include_archived=true' : currentTab}`);
        const sessions = await sessionsRes.json();
        const fairnessRes = await fetch('https://tennis-app-9esu.onrender.com/fairness');
        const fairness = await fairnessRes.json();
        const reliabilityRes = await fetch('https://tennis-app-9esu.onrender.com/reliability');
        const reliability = await reliabilityRes.json();
        const dashboard = document.getElementById('dashboard');
        

        const counts = {};
        fairness.forEach(h => counts[h.name] = h.rate);
        const values = Object.values(counts);
        const max = Math.max(...values, 1);
        const min = Math.min(...values, 0);
        const mid = (max + min) / 2;

        function getColor(name) {
          const rate = counts[name] ?? 0;
          if (rate <= min + (mid - min) / 2) return '#16a34a';
          if (rate <= mid) return '#ca8a04';
          return '#dc2626';
        }

        document.getElementById('prev-btn').disabled = offset === 0;
        document.getElementById('next-btn').disabled = sessions.length < LIMIT;
        document.getElementById('page-info').textContent = `Page ${page}`;

        if (sessions.length === 0) {
          dashboard.innerHTML = `<p class="empty">No ${currentTab === 'upcoming' ? 'upcoming' : 'past'} sessions found.</p>`;
          return;
        }

        let html = '';
        for (const session of sessions) {
          const availRes = await fetch(`https://tennis-app-9esu.onrender.com/availability/${session.id}`);
          const availability = await availRes.json();
          const assignRes = await fetch(`https://tennis-app-9esu.onrender.com/assignments/${session.id}`);
          const assignments = await assignRes.json();
          const assignedIds = assignments.filter(a => a.status === 'approved').map(a => a.helper_id);

          const helperRows = availability.length === 0
            ? '<p class="empty">No helpers available yet.</p>'
            : availability.map(a => {
                const assignment = assignments.find(x => x.helper_id === a.helper_id);
                const status = assignment ? assignment.status : null;

                let btns = '';
                if (currentTab === 'past') {
                  const statusTag = status === 'approved' ? '<span class="tag tag-green">Approved</span>'
                    : status === 'waitlist' ? '<span class="tag tag-yellow">Waitlisted</span>'
                    : status === 'declined' ? '<span class="tag tag-red">Declined</span>'
                    : '<span class="tag tag-gray">No response</span>';
                  btns = statusTag;
                } else if (status === 'approved') {
                  btns = `<div class="action-btns"><span class="tag tag-green">Approved</span><button class="btn btn-gray btn-sm" onclick="updateStatus('${session.id}', '${a.helper_id}', 'pending')">Undo</button></div>`;
                } else if (status === 'waitlist') {
                  btns = `<div class="action-btns"><span class="tag tag-yellow">Waitlisted</span><button class="btn btn-approved btn-sm" onclick="updateStatus('${session.id}', '${a.helper_id}', 'approved')">Approve</button><button class="btn btn-danger btn-sm" onclick="updateStatus('${session.id}', '${a.helper_id}', 'declined')">Decline</button></div>`;
                } else if (status === 'declined') {
                  btns = `<div class="action-btns"><span class="tag tag-red">Declined</span><button class="btn btn-gray btn-sm" onclick="updateStatus('${session.id}', '${a.helper_id}', 'waitlist')">Undo</button></div>`;
                } else if (status === 'pending') {
                  btns = `<div class="action-btns">
                    <button class="btn btn-approved btn-sm" onclick="updateStatus('${session.id}', '${a.helper_id}', 'approved')">Approve</button>
                    <button class="btn btn-warning btn-sm" onclick="updateStatus('${session.id}', '${a.helper_id}', 'waitlist')">Waitlist</button>
                    <button class="btn btn-danger btn-sm" onclick="updateStatus('${session.id}', '${a.helper_id}', 'declined')">Decline</button>
                  </div>`;
                } else {
                  btns = `<div class="action-btns"><button class="btn btn-approved btn-sm" onclick="updateStatus('${session.id}', '${a.helper_id}', 'approved')">Approve</button><button class="btn btn-warning btn-sm" onclick="updateStatus('${session.id}', '${a.helper_id}', 'waitlist')">Waitlist</button><button class="btn btn-danger btn-sm" onclick="updateStatus('${session.id}', '${a.helper_id}', 'declined')">Decline</button></div>`;
                }

                const rel = reliability[a.helper_id];
                const relTag = rel && rel.rate !== null
                  ? `<span class="tag ${rel.rate >= 80 ? 'tag-green' : rel.rate >= 50 ? 'tag-yellow' : 'tag-red'}" style="font-size:11px">${rel.rate}%</span>`
                  : `<span class="tag tag-gray" style="font-size:11px">New</span>`;

                return `
                  <div class="helper-row">
                    <span class="helper-name">
                      <span class="dot" style="background:${getColor(a.helper_name)}"></span>
                      ${a.helper_name || a.helper_id}
                      ${relTag}
                    </span>
                    ${btns}
                  </div>`;
              }).join('');

          const actionBtns = currentTab === 'upcoming' ? `
            <div class="action-btns">
              <button class="btn btn-secondary btn-sm" onclick="window.location.href='edit-session.html?id=${session.id}&date=${formatDate(session.date)}&time=${encodeURIComponent(session.time)}&kids=${session.expected_kids}&notes=${encodeURIComponent(session.notes || '')}'">Edit</button>
              ${session.status === 'cancelled'
                ? `<span class="tag tag-red">Cancelled</span>`
                : `<button class="btn btn-warning btn-sm" onclick="cancelSession('${session.id}')">Cancel</button>`}
              <button class="btn btn-danger btn-sm" onclick="deleteSession('${session.id}')">Delete</button>
            </div>` : `
            <div class="action-btns">
              <button class="btn btn-secondary btn-sm" onclick="window.location.href='attendance.html?id=${session.id}&date=${formatDate(session.date)}&time=${encodeURIComponent(session.time)}'">Attendance</button>
            </div>`;

          html += `
            <div class="card-wide">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
                <div>
                  <h2>${formatDate(session.date)}</h2>
                  ${(() => {
                    const needed = Math.ceil(session.expected_kids / 6);
                    const assigned = assignedIds.length;
                    let warning = '';
                    if (assigned === 0) {
                      warning = `<span class="tag tag-red" style="margin-left:8px">No helpers assigned</span>`;
                    } else if (assigned < needed) {
                      warning = `<span class="tag tag-yellow" style="margin-left:8px">Need ${needed - assigned} more helper${needed - assigned > 1 ? 's' : ''}</span>`;
                    } else if (assigned > needed + 1) {
                      warning = `<span class="tag tag-yellow" style="margin-left:8px">May be overstaffed</span>`;
                    } else {
                      warning = `<span class="tag tag-green" style="margin-left:8px">Staffing looks good</span>`;
                    }
                    return `<p class="session-meta">${session.time} &middot; ${session.expected_kids} kids &middot; ${assigned} assigned ${warning}</p>`;
                  })()}
                </div>
                ${actionBtns}
              </div>
              ${helperRows}
            </div>`;
        }

        if (currentTab === 'upcoming') {
          html += `
            <div class="card-wide" style="padding:12px 20px">
              <p style="font-size:12px;color:#999;margin-bottom:8px;font-weight:500">FAIRNESS KEY</p>
              <div style="display:flex;gap:16px;flex-wrap:wrap">
                <span style="font-size:13px;color:#444;display:flex;align-items:center;gap:6px"><span class="dot" style="background:#16a34a"></span>Fewest sessions</span>
                <span style="font-size:13px;color:#444;display:flex;align-items:center;gap:6px"><span class="dot" style="background:#ca8a04"></span>Average</span>
                <span style="font-size:13px;color:#444;display:flex;align-items:center;gap:6px"><span class="dot" style="background:#dc2626"></span>Most sessions</span>
              </div>
            </div>`;
        }

        dashboard.innerHTML = html;
      } catch (err) {
        console.error('Dashboard error:', err);
        document.getElementById('dashboard').innerHTML = '<p class="empty">Error loading dashboard.</p>';
      }
    }

    function changePage(direction) {
      offset += direction * LIMIT;
      page += direction;
      loadDashboard();
      window.scrollTo(0, 0);
    }

    async function updateStatus(sessionId, helperId, status) {
      const messages = {
        'approved': 'Approve this helper?',
        'waitlist': 'Add this helper to the waitlist?',
        'declined': 'Decline this helper?',
        'pending': 'Undo this approval?'
      };
      if (!confirm(messages[status] || 'Are you sure?')) return;
      try {
        await fetch(`https://tennis-app-9esu.onrender.com/assignments/${sessionId}/${helperId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        loadDashboard();
      } catch (err) {
        console.error('Update error:', err);
      }
    }

    async function cancelSession(sessionId) {
      if (!confirm('Are you sure you want to cancel this session?')) return;
      await fetch(`https://tennis-app-9esu.onrender.com/sessions/${sessionId}/cancel`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' }
      });
      loadDashboard();
    }

    async function deleteSession(sessionId) {
      if (!confirm('Are you sure you want to delete this session?')) return;
      await fetch(`https://tennis-app-9esu.onrender.com/sessions/${sessionId}`, { method: 'DELETE' });
      loadDashboard();
    }

    function logout() {
      localStorage.removeItem('user');
      window.location.href = 'index.html';
    }

    loadDashboard();
    
    async function runArchive() {
      if (!confirm('Archive all sessions older than 30 days?')) return;
      await fetch('https://tennis-app-9esu.onrender.com/archive', { method: 'POST' });
      loadDashboard();
    }
  </script>
<button class="dark-toggle" onclick="toggleDark()" id="dark-btn">🌙</button>
<script>
  function toggleDark() {
    const isDark = document.body.classList.toggle('dark');
    localStorage.setItem('darkMode', isDark);
    document.getElementById('dark-btn').textContent = isDark ? '☀️' : '🌙';
  }
  if (localStorage.getItem('darkMode') === 'true') {
    document.body.classList.add('dark');
    document.getElementById('dark-btn').textContent = '☀️';
  }
</script>
</body>
</html>
