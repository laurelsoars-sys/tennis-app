<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Activity</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="padding:20px">
  <div class="page-header">
    <div class="logo">
      <div class="logo-icon">🎾</div>
      <div>
        <div class="logo-text">My activity</div>
        <div class="logo-sub" id="welcome"></div>
      </div>
    </div>
    <div class="header-buttons">
      <button class="btn btn-secondary btn-sm" onclick="window.location.href='sessions.html'">Back</button>
    </div>
  </div>

  <div id="summary" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px"></div>

  <div class="tabs" style="display:flex;gap:4px;margin-bottom:20px;background:#f0f4f0;padding:4px;border-radius:12px;width:fit-content">
    <button id="tab-upcoming" style="padding:8px 20px;border-radius:9px;border:none;font-size:14px;font-weight:500;cursor:pointer;background:white;color:#16a34a;box-shadow:0 1px 4px rgba(0,0,0,0.08)" onclick="switchTab('upcoming')">Upcoming</button>
    <button id="tab-past" style="padding:8px 20px;border-radius:9px;border:none;font-size:14px;font-weight:500;cursor:pointer;background:none;color:#666" onclick="switchTab('past')">Past</button>
  </div>

  <div id="activity-list"></div>
  <div class="court-lines"></div>

  <script>
        function formatDate(dateStr) {
      const date = new Date(dateStr + 'T00:00:00');
      const today = new Date();
      const tomorrow = new Date();
      tomorrow.setDate(today.getDate() + 1);
      
      today.setHours(0,0,0,0);
      tomorrow.setHours(0,0,0,0);
      date.setHours(0,0,0,0);
      
      if (date.getTime() === today.getTime()) return 'Today';
      if (date.getTime() === tomorrow.getTime()) return 'Tomorrow';
      
      return date.toLocaleDateString('en-US', { 
        weekday: 'long', 
        month: 'long', 
        day: 'numeric' 
      });
    }
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) window.location.href = 'index.html';
    document.getElementById('welcome').textContent = `Hi ${user.full_name}!`;

    let currentTab = 'upcoming';

    async function loadSummary() {
      try {
        const res = await fetch(`https://tennis-app-9esu.onrender.com/helper-history/${user.id}?filter=upcoming`);
        const sessions = await res.json();
        
        const approved = sessions.filter(s => s.status === 'approved').length;
        const pending = sessions.filter(s => !s.status && s.availability === 'available').length;
        const waitlisted = sessions.filter(s => s.status === 'waitlist').length;
        const total = sessions.length;

        document.getElementById('summary').innerHTML = `
          <div class="card-wide" style="flex:1;min-width:120px;text-align:center;padding:16px">
            <div style="font-size:24px;font-weight:600;color:#16a34a">${total}</div>
            <div style="font-size:12px;color:#666;margin-top:2px">Upcoming</div>
          </div>
          <div class="card-wide" style="flex:1;min-width:120px;text-align:center;padding:16px">
            <div style="font-size:24px;font-weight:600;color:#16a34a">${approved}</div>
            <div style="font-size:12px;color:#666;margin-top:2px">Approved</div>
          </div>
          <div class="card-wide" style="flex:1;min-width:120px;text-align:center;padding:16px">
            <div style="font-size:24px;font-weight:600;color:#ca8a04">${pending}</div>
            <div style="font-size:12px;color:#666;margin-top:2px">Pending</div>
          </div>
          <div class="card-wide" style="flex:1;min-width:120px;text-align:center;padding:16px">
            <div style="font-size:24px;font-weight:600;color:#ca8a04">${waitlisted}</div>
            <div style="font-size:12px;color:#666;margin-top:2px">Waitlisted</div>
          </div>
        `;
      } catch (err) {
        console.error('Summary error:', err);
      }
    }

    async function loadActivity(filter = 'upcoming') {
      try {
        const response = await fetch(`https://tennis-app-9esu.onrender.com/helper-history/${user.id}?filter=${filter}`);
        const sessions = await response.json();
        const list = document.getElementById('activity-list');

        if (sessions.length === 0) {
          list.innerHTML = `<p class="empty">No ${filter} sessions found.</p>`;
          return;
        }

        list.innerHTML = sessions.map(s => {
          const statusTag = s.status === 'approved' ? '<span class="tag tag-green">Approved</span>'
            : s.status === 'waitlist' ? '<span class="tag tag-yellow">Waitlisted</span>'
            : s.status === 'declined' ? '<span class="tag tag-red">Declined</span>'
            : s.availability === 'available' ? '<span class="tag tag-gray">Pending</span>'
            : s.availability === 'unavailable' ? '<span class="tag tag-red">Not available</span>'
            : '<span class="tag tag-gray">No response</span>';

          const cancelledTag = s.session_status === 'cancelled'
            ? '<span class="tag tag-red" style="margin-left:6px">Cancelled</span>'
            : '';

          const withdrawBtn = filter === 'upcoming' && s.availability && s.status !== 'approved'
            ? `<button class="btn btn-danger btn-sm" style="margin-top:10px;width:100%" onclick="withdraw('${s.id}')">Change response</button>`
            : '';

          return `
            <div class="card-wide">
              <div style="display:flex;justify-content:space-between;align-items:flex-start">
                <div>
                  <h2>${s.date} ${cancelledTag}</h2>
                  <p class="session-meta">${s.time} &middot; ${s.expected_kids} kids${s.notes ? ` &middot; ${s.notes}` : ''}</p>
                </div>
                ${statusTag}
              </div>
              ${withdrawBtn}
            </div>`;
        }).join('');
      } catch (err) {
        document.getElementById('activity-list').innerHTML = '<p class="empty">Error loading activity.</p>';
      }
    }

    async function withdraw(sessionId) {
      if (!confirm('Are you sure you want to withdraw your availability?')) return;
      await fetch(`https://tennis-app-9esu.onrender.com/availability/${sessionId}/${user.id}`, { method: 'DELETE' });
      loadActivity(currentTab);
      loadSummary();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-upcoming').style.background = tab === 'upcoming' ? 'white' : 'none';
      document.getElementById('tab-upcoming').style.color = tab === 'upcoming' ? '#16a34a' : '#666';
      document.getElementById('tab-past').style.background = tab === 'past' ? 'white' : 'none';
      document.getElementById('tab-past').style.color = tab === 'past' ? '#16a34a' : '#666';
      loadActivity(tab);
    }

    loadSummary();
    loadActivity();
  </script>
</body>
</html>
