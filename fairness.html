<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fairness Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { margin: 0; color: #1a1a1a; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    .helper-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
    .helper-row:last-child { border-bottom: none; }
    .helper-name { font-size: 15px; color: #1a1a1a; font-weight: 500; }
    .bar-container { flex: 1; margin: 0 16px; background: #f0f4f8; border-radius: 8px; height: 10px; }
    .bar { height: 10px; border-radius: 8px; background: #2563eb; min-width: 4px; transition: width 0.3s; }
    .count { font-size: 14px; color: #666; min-width: 80px; text-align: right; }
    button { padding: 8px 16px; background: none; color: #666; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; cursor: pointer; }
    button:hover { background: #f0f4f8; }
    .empty { color: #666; text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Fairness tracker</h1>
    <button onclick="window.location.href='coach.html'">Back to dashboard</button>
  </div>
  <div class="card">
    <div id="fairness-list"></div>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'coach') window.location.href = 'index.html';

    async function loadFairness() {
      try {
        const response = await fetch('https://tennis-app-9esu.onrender.com/fairness');
        const data = await response.json();
        const list = document.getElementById('fairness-list');

        if (data.length === 0) {
          list.innerHTML = '<p class="empty">No helpers found.</p>';
          return;
        }

        const max = Math.max(...data.map(h => h.rate), 1);

        list.innerHTML = data.map(helper => `
        <div class="helper-row">
            <span class="helper-name">${helper.name}</span>
            <div class="bar-container">
            <div class="bar" style="width:${(helper.rate / max) * 100}%"></div>
            </div>
            <span class="count">${helper.rate}% (${helper.sessions}/${helper.available})</span>
        </div>
        `).join('');
      } catch (err) {
        document.getElementById('fairness-list').innerHTML = '<p class="empty">Cannot reach server.</p>';
      }
    }

    loadFairness();
  </script>
</body>
</html>
