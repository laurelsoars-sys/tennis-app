<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fairness Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .bar-container { flex:1; margin:0 16px; background:#f0f4f0; border-radius:8px; height:8px; }
    .bar { height:8px; border-radius:8px; background:#16a34a; min-width:4px; transition:width 0.4s; }
    .count { font-size:13px; color:#666; min-width:90px; text-align:right; }
  </style>
</head>
<body style="padding:20px">
  <div class="page-header">
    <div class="logo">
      <div class="logo-icon">🎾</div>
      <div>
        <div class="logo-text">Fairness tracker</div>
        <div class="logo-sub">Assignment rate by helper</div>
      </div>
    </div>
    <div class="header-buttons">
      <button class="btn btn-secondary btn-sm" onclick="window.location.href='coach.html'">Back</button>
    </div>
  </div>

  <div style="max-width:600px">
    <div class="card-wide" id="fairness-list"></div>
  </div>
  <div class="court-lines"></div>

  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'coach') window.location.href = 'index.html';

    async function loadFairness() {
        document.getElementById('fairness-list').innerHTML = '<div class="loading-state"><div class="spinner"></div><span>Loading...</span></div>';
      try {
        const response = await fetch('https://tennis-app-9esu.onrender.com/fairness');
        const data = await response.json();
        const list = document.getElementById('fairness-list');

        if (data.length === 0) {
          list.innerHTML = '<p class="empty">No helpers found.</p>';
          return;
        }

        const max = Math.max(...data.map(h => h.rate), 1);

        list.innerHTML = data.map(helper => `
          <div class="helper-row">
            <span class="helper-name">${helper.name}</span>
            <div class="bar-container">
              <div class="bar" style="width:${(helper.rate / max) * 100}%"></div>
            </div>
            <span class="count">${helper.rate}% (${helper.sessions}/${helper.available})</span>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('fairness-list').innerHTML = '<p class="empty">Cannot reach server.</p>';
      }
    }

    loadFairness();
  </script>
<button class="dark-toggle" onclick="toggleDark()" id="dark-btn">🌙</button>
<script>
  function toggleDark() {
    const isDark = document.body.classList.toggle('dark');
    localStorage.setItem('darkMode', isDark);
    document.getElementById('dark-btn').textContent = isDark ? '☀️' : '🌙';
  }
  if (localStorage.getItem('darkMode') === 'true') {
    document.body.classList.add('dark');
    document.getElementById('dark-btn').textContent = '☀️';
  }
</script>
</body>
</html>
