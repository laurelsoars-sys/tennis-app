<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-center">
    <div class="card">
      <div class="logo">
        <div class="logo-icon">🎾</div>
        <div>
          <div class="logo-text">Tennis App</div>
          <div class="logo-sub">Create your account</div>
        </div>
      </div>
      <h1>Sign up</h1>
      <p style="margin-bottom:20px;color:#666">Join as a helper</p>
      <label>Full name</label>
      <input type="text" id="name" placeholder="Your full name" />
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" />
      <label>Password</label>
      <input type="password" id="password" placeholder="At least 6 characters" />
      <label>Phone number</label>
      <input type="tel" id="phone" placeholder="+1 555 000 0000" />
      <button class="btn btn-primary" onclick="signup()">Create account</button>
      <div class="error-msg" id="error"></div>
      <div class="success-msg" id="success"></div>
      <div style="text-align:center;margin-top:16px;font-size:13px;color:#666">
        Already have an account? <a href="index.html" style="color:#16a34a;text-decoration:none;font-weight:500">Sign in</a>
      </div>
    </div>
  </div>
  <div class="court-lines"></div>

  <script>
    async function signup() {
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const phone = document.getElementById('phone').value;

      if (!name || !email || !password) {
        document.getElementById('error').textContent = 'Please fill in all required fields.';
        return;
      }
      if (password.length < 6) {
        document.getElementById('error').textContent = 'Password must be at least 6 characters.';
        return;
      }
      if (!confirm('Create your account?')) return;

      try {
        const response = await fetch('https://tennis-app-9esu.onrender.com/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, full_name: name, phone })
        });
        const data = await response.json();
        if (response.ok) {
          document.getElementById('success').textContent = 'Account created! Redirecting to sign in...';
          document.getElementById('error').textContent = '';
          setTimeout(() => window.location.href = 'index.html', 2000);
        } else {
          document.getElementById('error').textContent = data.detail || 'Signup failed.';
        }
      } catch (err) {
        document.getElementById('error').textContent = 'Cannot reach server.';
      }
    }
    </script>
<button class="dark-toggle" onclick="toggleDark()" id="dark-btn">🌙</button>
<script>
    function toggleDark() {
        const isDark = document.body.classList.toggle('dark');
        localStorage.setItem('darkMode', isDark);
        document.getElementById('dark-btn').textContent = isDark ? '☀️' : '🌙';
    }
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
        document.getElementById('dark-btn').textContent = '☀️';
}
</script>
</body>
</html>
