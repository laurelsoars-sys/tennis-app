<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 100%; max-width: 380px; }
    h1 { margin-top: 0; font-size: 24px; color: #1a1a1a; }
    label { font-size: 14px; color: #444; display: block; margin-bottom: 4px; }
    input { width: 100%; padding: 10px; margin-bottom: 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .error { color: red; font-size: 13px; margin-top: 8px; }
    .success { color: green; font-size: 13px; margin-top: 8px; }
    .login-link { text-align: center; margin-top: 16px; font-size: 14px; color: #666; }
    .login-link a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create account</h1>
    <p style="color:#666">Sign up as a helper</p>
    <label>Full name</label>
    <input type="text" id="name" placeholder="Your full name" />
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" />
    <label>Password</label>
    <input type="password" id="password" placeholder="At least 6 characters" />
    <button onclick="signup()">Create account</button>
    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
    <div class="login-link">Already have an account? <a href="index.html">Sign in</a></div>
  </div>

  <script>
    async function signup() {
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!name || !email || !password) {
        document.getElementById('error').textContent = 'Please fill in all fields.';
        return;
      }

      if (password.length < 6) {
        document.getElementById('error').textContent = 'Password must be at least 6 characters.';
        return;
      }

      try {
        const response = await fetch('https://tennis-app-9esu.onrender.com/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, full_name: name })
        });

        const data = await response.json();

        if (response.ok) {
          document.getElementById('success').textContent = 'Account created! You can now sign in.';
          document.getElementById('error').textContent = '';
          setTimeout(() => window.location.href = 'index.html', 2000);
        } else {
          document.getElementById('error').textContent = data.detail || 'Signup failed.';
        }
      } catch (err) {
        document.getElementById('error').textContent = 'Cannot reach server.';
      }
    }
  </script>
</body>
</html>
