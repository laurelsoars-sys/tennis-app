<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tennis App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-center">
    <div class="card">
      <div class="logo">
        <div class="logo-icon">🎾</div>
        <div>
          <div class="logo-text">Tennis App</div>
          <div class="logo-sub">Session management</div>
        </div>
      </div>
      <h1>Welcome back</h1>
      <p style="margin-bottom:20px">Sign in to continue</p>
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" />
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" />
      <button class="btn btn-primary" onclick="login()">Sign in</button>
      <div class="error-msg" id="error"></div>
      <div style="text-align:center;margin-top:16px;font-size:13px;color:#666">
        No account? <a href="signup.html" style="color:#16a34a;text-decoration:none;font-weight:500">Sign up as a helper</a>
      </div>
    </div>
  </div>
  <div class="court-lines"></div>

  <script>
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const response = await fetch('https://tennis-app-9esu.onrender.com/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await response.json();
        if (response.ok) {
          localStorage.setItem('user', JSON.stringify(data));
          if (data.role === 'coach') {
            window.location.href = 'coach.html';
          } else {
            window.location.href = 'sessions.html';
          }
        }
      } catch (err) {
        document.getElementById('error').textContent = 'Cannot reach server. Is it running?';
      }
    }
  </script>
</body>
</html>
