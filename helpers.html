<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helpers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="padding:20px">
  <div class="page-header">
    <div class="logo">
      <div class="logo-icon">🎾</div>
      <div>
        <div class="logo-text">All helpers</div>
        <div class="logo-sub">Everyone registered in the system</div>
      </div>
    </div>
    <div class="header-buttons">
      <button class="btn btn-secondary btn-sm" onclick="window.location.href='coach.html'">Back</button>
    </div>
  </div>

  <div style="max-width:600px">
    <div class="card-wide" id="helpers-list"></div>
  </div>
  <div class="court-lines"></div>

  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'coach') window.location.href = 'index.html';

    async function loadHelpers() {
        document.getElementById('helpers-list').innerHTML = '<div class="loading-state"><div class="spinner"></div><span>Loading helpers...</span></div>';
        try {
            const response = await fetch('https://tennis-app-9esu.onrender.com/helpers');
            const helpers = await response.json();
            const relRes = await fetch('https://tennis-app-9esu.onrender.com/reliability');
            const reliability = await relRes.json();
            const list = document.getElementById('helpers-list');

            if (helpers.length === 0) {
            list.innerHTML = '<p class="empty">No helpers registered yet.</p>';
            return;
            }

            list.innerHTML = helpers.map(h => {
            const rel = Object.values(reliability).find(r => r.name === h.full_name);
            const relTag = rel && rel.rate !== null
                ? `<span class="tag ${rel.rate >= 80 ? 'tag-green' : rel.rate >= 50 ? 'tag-yellow' : 'tag-red'}">${rel.rate}% reliable</span>`
                : `<span class="tag tag-gray">No history yet</span>`;

            return `
                <div class="helper-row">
                <div>
                    <span class="helper-name">${h.full_name}</span>
                    <p style="font-size:13px;color:#666;margin-top:2px">${h.email}</p>
                </div>
                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
                    <span class="tag tag-green">${h.sessions_assigned} session${h.sessions_assigned !== 1 ? 's' : ''}</span>
                    ${relTag}
                </div>
                </div>`;
            }).join('');
        } catch (err) {
            document.getElementById('helpers-list').innerHTML = '<p class="empty">Cannot reach server.</p>';
        }
        }

    loadHelpers();
  </script>
<button class="dark-toggle" onclick="toggleDark()" id="dark-btn">🌙</button>
<script>
  function toggleDark() {
    const isDark = document.body.classList.toggle('dark');
    localStorage.setItem('darkMode', isDark);
    document.getElementById('dark-btn').textContent = isDark ? '☀️' : '🌙';
  }
  if (localStorage.getItem('darkMode') === 'true') {
    document.body.classList.add('dark');
    document.getElementById('dark-btn').textContent = '☀️';
  }
</script>
</body>
</html>
