<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Session</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .days-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:8px; }
    .day-btn { padding:8px 4px; background:#f5f7f5; color:#444; border:1.5px solid #e2e8e2; border-radius:10px; font-size:13px; cursor:pointer; text-align:center; font-weight:500; transition: all 0.15s; }
    .day-btn.selected { background:#16a34a; color:white; border-color:#16a34a; }
    .weeks-row { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
    .weeks-row label { margin:0; white-space:nowrap; min-width:80px; }
    .weeks-row input { margin:0; width:80px; }
  </style>
</head>
<body style="padding:20px">
  <div class="page-header">
    <div class="logo">
      <div class="logo-icon">🎾</div>
      <div>
        <div class="logo-text">Create session</div>
        <div class="logo-sub">Schedule a new session</div>
      </div>
    </div>
    <div class="header-buttons">
      <button class="btn btn-secondary btn-sm" onclick="window.location.href='coach.html'">Back</button>
    </div>
  </div>

  <div style="max-width:480px">
    <div class="card-wide">
      <label>Start date</label>
      <input type="date" id="date" />
      <label>Time</label>
      <input type="text" id="time" placeholder="e.g. 5:00 PM" />
      <label>Expected number of kids</label>
      <input type="number" id="kids" placeholder="e.g. 18" />
      <label>Notes (optional)</label>
      <input type="text" id="notes" placeholder="e.g. Bring extra balls, outdoor court 3" />

      <hr class="divider">

      <label>Repeat on these days</label>
      <div class="days-grid">
        <div class="day-btn" onclick="toggleDay(this, 0)">Sun</div>
        <div class="day-btn" onclick="toggleDay(this, 1)">Mon</div>
        <div class="day-btn" onclick="toggleDay(this, 2)">Tue</div>
        <div class="day-btn" onclick="toggleDay(this, 3)">Wed</div>
        <div class="day-btn" onclick="toggleDay(this, 4)">Thu</div>
        <div class="day-btn" onclick="toggleDay(this, 5)">Fri</div>
        <div class="day-btn" onclick="toggleDay(this, 6)">Sat</div>
      </div>

      <div class="weeks-row" style="margin-top:12px">
        <label>Repeat for</label>
        <input type="number" id="weeks" value="1" min="1" max="12" />
        <label>weeks</label>
      </div>

      <button class="btn btn-primary" onclick="createSession()">Create session</button>
      <div class="success-msg" id="success"></div>
      <div class="error-msg" id="error"></div>
    </div>
  </div>

  <div class="court-lines"></div>

  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'coach') window.location.href = 'index.html';

    const selectedDays = new Set();

    function toggleDay(btn, day) {
      if (selectedDays.has(day)) {
        selectedDays.delete(day);
        btn.classList.remove('selected');
      } else {
        selectedDays.add(day);
        btn.classList.add('selected');
      }
    }

    function getDatesForDays(startDate, days, weeks) {
      const dates = [];
      const start = new Date(startDate);
      start.setDate(start.getDate() + 1);
      for (let w = 0; w < weeks; w++) {
        for (let d = 0; d < 7; d++) {
          const date = new Date(start);
          date.setDate(start.getDate() + (w * 7) + d);
          if (days.has(date.getDay())) {
            dates.push(date.toISOString().split('T')[0]);
          }
        }
      }
      return dates;
    }

    async function createSession() {
      const date = document.getElementById('date').value;
      const time = document.getElementById('time').value;
      const kids = document.getElementById('kids').value;
      const weeks = parseInt(document.getElementById('weeks').value);
      const notes = document.getElementById('notes').value;

      if (!date || !time || !kids) {
        document.getElementById('error').textContent = 'Please fill in all required fields.';
        return;
      }

      let dates = selectedDays.size > 0 ? getDatesForDays(date, selectedDays, weeks) : [date];

      if (!confirm(`Create ${dates.length} session${dates.length > 1 ? 's' : ''}?`)) return;

      document.getElementById('error').textContent = '';
      document.getElementById('success').textContent = '';

      try {
        let created = 0;
        for (const d of dates) {
          const response = await fetch('https://tennis-app-9esu.onrender.com/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              date: d,
              time,
              expected_kids: parseInt(kids),
              created_by: user.id,
              notes
            })
          });
          if (response.ok) created++;
        }
        document.getElementById('success').textContent = `${created} session${created > 1 ? 's' : ''} created!`;
        document.getElementById('date').value = '';
        document.getElementById('time').value = '';
        document.getElementById('kids').value = '';
        document.getElementById('notes').value = '';
        selectedDays.clear();
        document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('selected'));
      } catch (err) {
        document.getElementById('error').textContent = 'Cannot reach server.';
      }
    }
  </script>
</body>
</html>
