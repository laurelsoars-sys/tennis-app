<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sessions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="padding:20px">
  <div class="page-header">
    <div class="logo">
      <div class="logo-icon">🎾</div>
      <div>
        <div class="logo-text">Upcoming sessions</div>
        <div class="logo-sub" id="welcome"></div>
      </div>
    </div>
    <div class="header-buttons">
      <div style="position:relative;display:inline-block">
        <button class="btn btn-secondary btn-sm" onclick="toggleNotifications()" id="bell-btn">🔔 <span id="notif-count" style="display:none;background:#dc2626;color:white;border-radius:50%;padding:1px 6px;font-size:11px;margin-left:2px"></span></button>
        <div id="notif-dropdown" style="display:none;position:fixed;right:10px;top:70px;background:white;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.15);width:calc(100vw - 20px);max-width:320px;z-index:1000;padding:8px 0">
          <div id="notif-list" style="max-height:300px;overflow-y:auto"></div>
        </div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="window.location.href='history.html'">My history</button>
      <button id="coach-btn" class="btn btn-secondary btn-sm" onclick="window.location.href='coach.html'" style="display:none">Coach view</button>
      <button class="btn btn-secondary btn-sm" onclick="logout()">Sign out</button>
    </div>
  </div>
  <div id="sessions-list"></div>
  <div class="court-lines"></div>

  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) window.location.href = 'index.html';
    if (user.role === 'coach') document.getElementById('coach-btn').style.display = 'inline-block';
    document.getElementById('welcome').textContent = `Hi ${user.full_name}!`;

    async function loadSessions() {
      try {
        const response = await fetch('https://tennis-app-9esu.onrender.com/sessions?filter=upcoming');
        const sessions = await response.json();
        const list = document.getElementById('sessions-list');

        if (sessions.length === 0) {
          list.innerHTML = '<p class="empty">No upcoming sessions yet.</p>';
          return;
        }

        const availRes = await fetch(`https://tennis-app-9esu.onrender.com/availability/user/${user.id}`);
        const myAvailability = await availRes.json();
        const availableSessionIds = new Set(myAvailability.map(a => a.session_id));

        list.innerHTML = sessions.map(session => `
          <div class="card-wide">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <h2>${session.date}</h2>
                <p class="session-meta">${session.time} &middot; ${session.expected_kids} kids expected${session.notes ? ` &middot; ${session.notes}` : ''}</p>
              </div>
              ${session.status === 'cancelled'
                ? `<span class="tag tag-red">Cancelled</span>`
                : availableSessionIds.has(session.id)
                  ? `<button class="btn btn-danger btn-sm" data-available="true" onclick="markAvailable('${session.id}', this)">Withdraw</button>`
                  : `<button class="btn btn-primary btn-sm" data-available="false" onclick="markAvailable('${session.id}', this)">I'm available</button>`
              }
            </div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('sessions-list').innerHTML = '<p class="empty">Cannot reach server.</p>';
      }
    }

    async function markAvailable(sessionId, btn) {
      const alreadyAvailable = btn.dataset.available === 'true';
      
      if (alreadyAvailable) {
        if (!confirm('Are you sure you want to withdraw your availability?')) return;
        await fetch(`https://tennis-app-9esu.onrender.com/availability/${sessionId}/${user.id}`, { method: 'DELETE' });
        btn.textContent = "I'm available";
        btn.classList.remove('btn-danger');
        btn.classList.add('btn-primary');
        btn.dataset.available = 'false';
      } else {
        if (!confirm('Confirm you are available for this session?')) return;
        await fetch('https://tennis-app-9esu.onrender.com/availability', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, helper_id: user.id, status: 'available' })
        });
        btn.textContent = "Withdraw";
        btn.classList.remove('btn-primary');
        btn.classList.add('btn-danger');
        btn.dataset.available = 'true';
      }
    }
    let notifications = [];

    async function loadNotifications() {
      try {
        const res = await fetch(`https://tennis-app-9esu.onrender.com/notifications/${user.id}`);
        notifications = await res.json();
        const count = document.getElementById('notif-count');
        if (notifications.length > 0) {
          count.style.display = 'inline';
          count.textContent = notifications.length;
        } else {
          count.style.display = 'none';
        }
      } catch (err) {
        console.error('Notifications error:', err);
      }
    }

    function toggleNotifications() {
      const dropdown = document.getElementById('notif-dropdown');
      const isOpen = dropdown.style.display === 'block';
      
      if (!isOpen) {
        const list = document.getElementById('notif-list');
        if (notifications.length === 0) {
          list.innerHTML = '<p style="padding:12px 16px;font-size:13px;color:#999">No notifications yet</p>';
        } else {
          list.innerHTML = notifications.map(n => `
            <div style="padding:12px 16px;border-bottom:1px solid #f0f4f0;font-size:13px;color:#1a1a1a">
              <span style="color:#16a34a;font-weight:500">Approved!</span> ${n.message}
            </div>
          `).join('');
        }
      }
      
      dropdown.style.display = isOpen ? 'none' : 'block';
    }

    document.addEventListener('click', function(e) {
      if (!e.target.closest('#bell-btn') && !e.target.closest('#notif-dropdown')) {
        document.getElementById('notif-dropdown').style.display = 'none';
      }
    });

    function logout() {
      localStorage.removeItem('user');
      window.location.href = 'index.html';
    }
    
    loadSessions();
    loadNotifications();
  </script>
</body>
</html>
