<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sessions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="padding:20px">
  <div class="page-header">
    <div class="tabs" style="display:flex;gap:4px;margin-bottom:20px;background:#f0f4f0;padding:4px;border-radius:12px;width:fit-content">
      <button id="tab-upcoming" style="padding:8px 20px;border-radius:9px;border:none;font-size:14px;font-weight:500;cursor:pointer;background:white;color:#16a34a;box-shadow:0 1px 4px rgba(0,0,0,0.08)" onclick="switchTab('upcoming')">Upcoming</button>
      <button id="tab-past" style="padding:8px 20px;border-radius:9px;border:none;font-size:14px;font-weight:500;cursor:pointer;background:none;color:#666" onclick="switchTab('past')">Past sessions</button>
    </div>
    <div class="logo">
      <div class="logo-icon">🎾</div>
      <div>
        <div class="logo-text">Upcoming sessions</div>
        <div class="logo-sub" id="welcome"></div>
      </div>
    </div>
    <div class="header-buttons">
      <button id="coach-btn" class="btn btn-secondary btn-sm" onclick="window.location.href='coach.html'" style="display:none">Coach view</button>
      <button class="btn btn-secondary btn-sm" onclick="window.location.href='history.html'">My history</button>
      <button class="btn btn-secondary btn-sm" onclick="logout()">Sign out</button>
    </div>
  </div>
  <div id="sessions-list"></div>
  <div class="court-lines"></div>

  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) window.location.href = 'index.html';
    if (user.role === 'coach') document.getElementById('coach-btn').style.display = 'inline-block';
    document.getElementById('welcome').textContent = `Hi ${user.full_name}!`;

    async function loadSessions(filter = 'upcoming') {
      try {
        const response = await fetch(`https://tennis-app-9esu.onrender.com/sessions?filter=${filter}`);
        const sessions = await response.json();
        const list = document.getElementById('sessions-list');
        if (sessions.length === 0) {
          list.innerHTML = '<p class="empty">No upcoming sessions yet.</p>';
          return;
        }
        list.innerHTML = sessions.map(session => `
          <div class="card-wide">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <h2>${session.date}</h2>
                <p class="session-meta">${session.time} &middot; ${session.expected_kids} kids expected${session.notes ? ` &middot; ${session.notes}` : ''}</p>
              </div>
              ${session.status === 'cancelled'
                ? `<span class="tag tag-red">Cancelled</span>`
                : `<button class="btn btn-primary btn-sm" id="btn-${session.id}" data-available="false" onclick="markAvailable('${session.id}', this)">I'm available</button>`
              }
            </div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('sessions-list').innerHTML = '<p class="empty">Cannot reach server.</p>';
      }
    }

    async function markAvailable(sessionId, btn) {
      const alreadyAvailable = btn.dataset.available === 'true';
      if (alreadyAvailable) {
        await fetch(`https://tennis-app-9esu.onrender.com/availability/${sessionId}/${user.id}`, { method: 'DELETE' });
        btn.textContent = "I'm available";
        btn.classList.remove('btn-danger');
        btn.classList.add('btn-primary');
        btn.dataset.available = 'false';
      } else {
        await fetch('https://tennis-app-9esu.onrender.com/availability', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, helper_id: user.id, status: 'available' })
        });
        btn.textContent = "Withdraw";
        btn.classList.remove('btn-primary');
        btn.classList.add('btn-danger');
        btn.dataset.available = 'true';
      }
    }
    function switchTab(tab) {
      document.getElementById('tab-upcoming').style.background = tab === 'upcoming' ? 'white' : 'none';
      document.getElementById('tab-upcoming').style.color = tab === 'upcoming' ? '#16a34a' : '#666';
      document.getElementById('tab-past').style.background = tab === 'past' ? 'white' : 'none';
      document.getElementById('tab-past').style.color = tab === 'past' ? '#16a34a' : '#666';
      loadSessions(tab);
    } 

    function logout() {
      localStorage.removeItem('user');
      window.location.href = 'index.html';
    }

    loadSessions();
  </script>
</body>
</html>
