<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Session</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="padding:20px">
  <div class="page-header">
    <div class="logo">
      <div class="logo-icon">🎾</div>
      <div>
        <div class="logo-text">Edit session</div>
        <div class="logo-sub">Update session details</div>
      </div>
    </div>
    <div class="header-buttons">
      <button class="btn btn-secondary btn-sm" onclick="window.location.href='coach.html'">Back</button>
    </div>
  </div>

  <div style="max-width:480px">
    <div class="card-wide">
      <label>Date</label>
      <input type="date" id="date" />
      <label>Time</label>
      <input type="text" id="time" placeholder="e.g. 5:00 PM" />
      <label>Expected number of kids</label>
      <input type="number" id="kids" placeholder="e.g. 18" />
      <label>Notes (optional)</label>
      <input type="text" id="notes" placeholder="e.g. Bring extra balls" />
      <button class="btn btn-primary" onclick="saveSession()">Save changes</button>
      <div class="success-msg" id="success"></div>
      <div class="error-msg" id="error"></div>
    </div>
  </div>

  <div class="court-lines"></div>

  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'coach') window.location.href = 'index.html';

    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('id');

    document.getElementById('date').value = params.get('date') || '';
    document.getElementById('time').value = params.get('time') || '';
    document.getElementById('kids').value = params.get('kids') || '';
    document.getElementById('notes').value = params.get('notes') || '';

    async function saveSession() {
      const date = document.getElementById('date').value;
      const time = document.getElementById('time').value;
      const kids = document.getElementById('kids').value;
      const notes = document.getElementById('notes').value;

      if (!date || !time || !kids) {
        document.getElementById('error').textContent = 'Please fill in all fields.';
        return;
      }

      if (!confirm('Save changes to this session?')) return;

      try {
        const response = await fetch(`https://tennis-app-9esu.onrender.com/sessions/${sessionId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date, time, expected_kids: parseInt(kids), notes })
        });
        if (response.ok) {
          document.getElementById('success').textContent = 'Session updated!';
          document.getElementById('error').textContent = '';
          setTimeout(() => window.location.href = 'coach.html', 1500);
        } else {
          document.getElementById('error').textContent = 'Failed to update session.';
        }
      } catch (err) {
        document.getElementById('error').textContent = 'Cannot reach server.';
      }
    }
  </script>
<button class="dark-toggle" onclick="toggleDark()" id="dark-btn">🌙</button>
<script>
  function toggleDark() {
    const isDark = document.body.classList.toggle('dark');
    localStorage.setItem('darkMode', isDark);
    document.getElementById('dark-btn').textContent = isDark ? '☀️' : '🌙';
  }
  if (localStorage.getItem('darkMode') === 'true') {
    document.body.classList.add('dark');
    document.getElementById('dark-btn').textContent = '☀️';
  }
</script>
</body>
</html>
